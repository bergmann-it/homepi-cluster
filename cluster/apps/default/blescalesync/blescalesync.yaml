---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blescalesync-dpl
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: blescalesync
        image: ghcr.io/kristianp26/ble-scale-sync
        imagePullPolicy: IfNotPresent
        env:
        - name: CONTINUOUS_MODE
          value: "true"
        - name: BLESCALE_PASSWD
          valueFrom:
            secretKeyRef:
              name: blescale
              key: passwd
        volumes:
        - name: blescalesync
          type: configMap
          mountPath: /app/config.yaml
          subPath: config.yaml
