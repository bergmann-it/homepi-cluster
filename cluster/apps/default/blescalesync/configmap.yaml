apiVersion: v1
kind: ConfigMap
metadata:
  name: blescalesync
  namespace: default
data:
  # file-like keys
  config.yaml: |
    # BLE Scale Sync — config.yaml
    # Generated by: npm run setup
    #
    # WARNING: This file may contain sensitive data (passwords, tokens).
    # Use ${ENV_VAR} references for secrets (resolved from .env at load time).
    #
    # Validate: npm run validate
    # Edit:     npm run setup (edit mode)

    version: 1
    scale:
      weight_unit: kg
      height_unit: cm
    unknown_user: nearest
    ble:
      handler: mqtt-proxy
      mqtt_proxy:
        broker_url: mqtt://192.168.8.32:1883
        device_id: proxy-og1
        topic_prefix: ble-proxy
        username: bleproxy
        password: ${BLESCALE_PASSWD}
      scale_mac: A0:85:5C:A7:DE:11
    users:
      - name: Clemens
        slug: clemens
        height: 176
        birth_date: 1985-03-28
        gender: male
        is_athlete: false
        weight_range:
          min: 65
          max: 75
        last_known_weight: null
    global_exporters:
      - type: mqtt
        broker_url: mqtts://mqtt.bergmann.click:8883
        topic: scale/badog1
        qos: 0
        retain: true
        username: bleproxy
        password: ${BLESCALE_PASSWD}
        client_id: badog1
        ha_discovery: true
        ha_device_name: Waage Bad OG1
    runtime:
      continuous_mode: true
      scan_cooldown: 30
      dry_run: true
      debug: false
      watchdog_max_consecutive_failures: 10
      watch_config: true
